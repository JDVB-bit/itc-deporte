name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # `requirements-dev.txt` arrastra `requirements.txt`, que ya instala el
      # propio paquete. Añadir aquí `-e .` pide la misma distribución dos veces
      # por rutas distintas y el resolutor lo rechaza (ResolutionImpossible).
      # Los tests importan desde `src/` igualmente: lo fija `pythonpath` en
      # pyproject.toml, que es también lo que hace honesta a la cobertura.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # La regla de dependencia de Clean Architecture se erosiona por descuido,
      # no por decisión. Se comprueba aquí, por separado y antes que el resto,
      # para que una violación se lea de un vistazo en el registro.
      - name: Verificar la regla de dependencia
        run: pytest tests/test_arquitectura.py

      - name: Suite completa
        run: pytest --cov=src/itc_deporte --cov-report=term-missing
